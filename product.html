<script>

/* ==========================================
   HTML 보호
========================================== */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==========================================
   이미지 주소 확인
========================================== */

function safeImageUrl(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(
        value,
        window.location.href
      );

    if (
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ) {

      return "";

    }

    return url.href;

  } catch (_) {

    return "";

  }

}


/* ==========================================
   가격
========================================== */

function formatPrice(value) {

  const price =
    Number(value);

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(price) ||
    price <= 0
  ) {

    return "가격 문의";

  }

  return (
    price.toLocaleString("ko-KR") +
    "원"
  );

}


/* ==========================================
   사양 한 줄
========================================== */

function specRow(
  label,
  value
) {

  const displayValue =

    value === null ||
    value === undefined ||
    String(value).trim() === ""

      ? "-"

      : String(value);

  return `

    <div class="spec-row">

      <div class="spec-name">
        ${escapeHTML(label)}
      </div>

      <div class="spec-value">
        ${escapeHTML(displayValue)}
      </div>

    </div>

  `;

}


/* ==========================================
   상품 출력
========================================== */

function renderProduct(product) {

  const container =
    document.getElementById(
      "productDetail"
    );


  const imageUrl =
    safeImageUrl(
      product.image_url
    );


  const imageHTML =

    imageUrl

      ? `

        <img
          src="${escapeHTML(imageUrl)}"
          alt="${escapeHTML(
            product.name || "상품 사진"
          )}"
          class="product-image"
        >

      `

      : `

        <div class="no-image">
          상품 이미지 준비중
        </div>

      `;


  const description =

    product.description

      ? `

        <div class="product-description">

          ${escapeHTML(
            product.description
          )}

        </div>

      `

      : "";


  container.className =
    "product-detail";


  container.innerHTML = `

    <!-- 상품 사진 -->

    <div class="image-area">

      <div class="product-image-box">

        ${imageHTML}

      </div>

    </div>


    <!-- 상품 정보 -->

    <div class="info-area">

      <div class="product-label">
        🖥️ PC SOLUTION 추천 PC
      </div>


      <h1 class="product-name">

        ${escapeHTML(
          product.name ||
          "상품명 없음"
        )}

      </h1>


      ${description}


      <div class="price-box">

        <div class="price-label">
          판매가
        </div>

        <div class="product-price">

          ${escapeHTML(
            formatPrice(
              product.price
            )
          )}

        </div>

      </div>


      <h2 class="spec-title">
        💻 주요 사양
      </h2>


      <div class="spec-list">

        ${specRow(
          "CPU",
          product.cpu
        )}

        ${specRow(
          "그래픽카드",
          product.gpu
        )}

        ${specRow(
          "RAM",
          product.ram
        )}

        ${specRow(
          "SSD",
          product.ssd
        )}

        ${specRow(
          "메인보드",
          product["main board"]
        )}

        ${specRow(
          "파워",
          product.power
        )}

        ${specRow(
          "모니터",
          product.monitor
        )}

        ${specRow(
          "HDD",
          product.hdd
        )}

        ${specRow(
          "키보드/마우스",
          product["keyboard mouse"]
        )}

      </div>


      <div class="button-area">

        <a
          href="consulting.html"
          class="consult-button"
        >
          🛠️ 이 구성으로 PC 컨설팅 신청
        </a>


        <a
          href="https://open.kakao.com/o/gYVLkHNi"
          target="_blank"
          rel="noopener noreferrer"
          class="kakao-button"
        >
          💬 카카오톡으로 문의하기
        </a>


        <a
          href="index.html"
          class="back-button"
        >
          ← 상품 목록으로 돌아가기
        </a>

      </div>


      <div class="notice">

        ※ 부품 가격 및 재고 상황에 따라
        실제 판매 가격과 일부 부품은
        변경될 수 있습니다.

      </div>

    </div>

  `;


  /*
    브라우저 제목도 상품명으로 변경
  */

  if (product.name) {

    document.title =
      product.name +
      " | PC SOLUTION";

  }

}


/* ==========================================
   오류 화면
========================================== */

function showError(
  title,
  message
) {

  const container =
    document.getElementById(
      "productDetail"
    );


  container.className =
    "error-box";


  container.innerHTML = `

    <h2>
      ${escapeHTML(title)}
    </h2>

    <p>
      ${escapeHTML(message)}
    </p>

    <a
      href="index.html"
      class="back-button"
      style="
        max-width:250px;
        margin:25px auto 0;
      "
    >
      ← 메인으로 돌아가기
    </a>

  `;

}


/* ==========================================
   상품 불러오기
========================================== */

async function loadProduct() {

  /*
    주소에서 상품번호 확인

    예:
    product.html?id=12
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const rawId =
    params.get("id");


  const productId =
    Number(rawId);


  if (
    !rawId ||
    !Number.isSafeInteger(
      productId
    ) ||
    productId <= 0
  ) {

    showError(
      "상품을 선택해주세요.",
      "상품번호가 올바르지 않습니다."
    );

    return;

  }


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("pcsolution")

      .select("*")

      .eq(
        "id",
        productId
      )

      .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      showError(
        "상품을 찾을 수 없습니다.",
        "삭제되었거나 존재하지 않는 상품입니다."
      );

      return;

    }


    renderProduct(
      data
    );


  } catch (error) {

    console.error(
      "상품 상세 불러오기 오류:",
      error
    );


    showError(
      "상품 정보를 불러오지 못했습니다.",
      "잠시 후 다시 시도해주세요."
    );

  }

}


/* ==========================================
   시작
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadProduct();

  }
);

</script>
