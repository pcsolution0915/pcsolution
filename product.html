<script>

/* ==========================================
   HTML 보호
========================================== */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==========================================
   이미지 주소 확인
========================================== */

function safeImageUrl(value) {

  if (typeof value !== "string" || !value.trim()) {
    return "";
  }

  try {

    const url =
      new URL(
        value,
        window.location.href
      );

    if (
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ) {

      return "";

    }

    return url.href;

  } catch (_) {

    return "";

  }

}


/* ==========================================
   가격
========================================== */

function formatPrice(value) {

  const price =
    Number(value);

  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(price) ||
    price <= 0
  ) {

    return "가격 문의";

  }

  return (
    price.toLocaleString("ko-KR") +
    "원"
  );

}


/* ==========================================
   사양 한 줄
========================================== */

function specRow(
  label,
  value
) {

  const displayValue =

    value === null ||
    value === undefined ||
    String(value).trim() === ""

      ? "-"

      : String(value);

  return `

    <div class="spec-row">

      <div class="spec-name">
        ${escapeHTML(label)}
      </div>

      <div class="spec-value">
        ${displayValue!=="-"?`<button type="button" class="pcs-part-detail-link" data-part-detail="${escapeHTML(({CPU:"cpu","그래픽카드":"gpu",RAM:"ram",SSD:"ssd","메인보드":"main_board","파워":"power","모니터":"monitor",HDD:"hdd","키보드/마우스":"keyboard_mouse"})[label]||'')}">${escapeHTML(displayValue)} <span>상세 보기 ↗</span></button>`:escapeHTML(displayValue)}
      </div>

    </div>

  `;

}


/* ==========================================
   상품 출력
========================================== */

function renderProduct(product) {
 window.pcsDisplayedProduct35=Number(product.id);
  const id = Number(product.id);
  const consultParams = new URLSearchParams();
  if (Number.isSafeInteger(id) && id > 0) {
    consultParams.set("product", String(id));
    consultParams.set("name", String(product.name || "관심 상품").slice(0,120));
  }
  const consultUrl = "consulting.html" + (consultParams.size ? "?" + consultParams.toString() : "");


  const container =
    document.getElementById(
      "productDetail"
    );


  const imageUrl =
    safeImageUrl(
      product.image_url
    );


  const imageHTML =

    imageUrl

      ? `

        <img
          src="${escapeHTML(imageUrl)}"
          alt="${escapeHTML(
            product.name || "상품 사진"
          )}"
          class="product-image"
        >

      `

      : `

        <div class="no-image">
          상품 이미지 준비중
        </div>

      `;


  const description =

    product.description

      ? `

        <div class="product-description">

          ${escapeHTML(
            product.description
          )}

        </div>

      `

      : "";


  container.className =
    "product-detail";
  container.setAttribute("aria-busy","false");


  container.innerHTML = `

    <!-- 상품 사진 -->

    <div class="image-area">

      <div class="product-image-box">

        ${imageHTML}

      </div>

    </div>


    <!-- 상품 정보 -->

    <div class="info-area">

      <div class="product-label">
        🖥️ PC SOLUTION 추천 PC
      </div>


      ${product.badge==='hot'?'<span class="pcs-product-badge pcs-product-badge-hot">HOT</span>':product.badge==='recommend'?'<span class="pcs-product-badge pcs-product-badge-recommend">추천</span>':''}
      <h1 class="product-name">

        ${escapeHTML(
          product.name ||
          "상품명 없음"
        )}

      </h1>




      <div class="price-box">

        <div class="price-label">
          판매가
        </div>

        <div class="product-price">

          ${escapeHTML(
            formatPrice(
              product.price
            )
          )}

        </div>

      </div>


      <h2 class="spec-title">
        💻 주요 사양
      </h2>


      <div class="spec-list">

        ${specRow(
          "CPU",
          product.cpu
        )}

        ${specRow(
          "그래픽카드",
          product.gpu
        )}

        ${specRow(
          "RAM",
          product.ram
        )}

        ${specRow(
          "SSD",
          product.ssd
        )}

        ${specRow(
          "메인보드",
          product["main board"]
        )}

        ${specRow(
          "파워",
          product.power
        )}

        ${specRow(
          "모니터",
          product.monitor
        )}

        ${specRow(
          "HDD",
          product.hdd
        )}

        ${specRow(
          "키보드/마우스",
          product["keyboard mouse"]
        )}

      </div>


      <div class="button-area">

        <a
          href="${escapeHTML(consultUrl)}"
          class="consult-button"
        >
          이 상품으로 상담 신청하기 →
        </a>


        <a
          href="https://open.kakao.com/o/gYVLkHNi"
          target="_blank"
          rel="noopener noreferrer"
          class="kakao-button"
        >
          💬 카카오톡으로 문의하기
        </a>


        <a
          href="index-v2.html#products"
          class="back-button"
        >
          ← 상품 목록으로 돌아가기
        </a>

      </div>


      <div class="notice">

        ※ 부품 가격 및 재고 상황에 따라
        실제 판매 가격과 일부 부품은
        변경될 수 있습니다.

      </div>

    </div>

    ${product.description||safeImageUrl(product.description_image_url)?`<section class="pcs-product-description" aria-labelledby="productDescriptionTitle"><h2 id="productDescriptionTitle">상품 상세 설명</h2>${description}${safeImageUrl(product.description_image_url)?`<img class="pcs-description-image" src="${escapeHTML(safeImageUrl(product.description_image_url))}" alt="${escapeHTML(product.name||'상품')} 상세 설명 이미지" loading="lazy" decoding="async">`:''}</section>`:''}

  `;


  /*
    브라우저 제목도 상품명으로 변경
  */

  if (product.name) {

    document.title =
      product.name +
      " | PC SOLUTION";

}

  `;

}


/* ==========================================
   상품 불러오기
========================================== */

async function loadProduct() {

  /*
    주소에서 상품번호 확인

    예:
    product.html?id=12
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const rawId =
    params.get("id");


  const productId =
    Number(rawId);


  if (
    !rawId ||
    !Number.isSafeInteger(
      productId
    ) ||
    productId <= 0
  ) {

    showError(
      "상품을 선택해주세요.",
      "상품번호가 올바르지 않습니다."
    );

    return;

  }


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("pcsolution")

      .select("*")

      .eq(
        "id",
        productId
      )

      .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      showError(
        "상품을 찾을 수 없습니다.",
        "삭제되었거나 존재하지 않는 상품입니다."
      );

      return;

    }


    renderProduct(
      data
    );


  } catch (error) {

    console.error(
      "상품 상세 불러오기 오류:",
      error
    );


    showError(
      "상품 정보를 불러오지 못했습니다.",
      "잠시 후 다시 시도해주세요."
    );

  }

}


/* ==========================================
   시작
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadProduct();

  }
);

</script>

<script>
(function(){
 const dialog=document.getElementById('pcsPartDialog35'),content=document.getElementById('pcsPartContent35'),title=document.getElementById('pcsPartTitle35');let request=0;
 document.getElementById('pcsPartClose35').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('close',()=>{++request;});
 function img(url,alt,cls=''){const safe=safeImageUrl(url);return safe?'<img class="'+cls+'" src="'+escapeHTML(safe)+'" alt="'+escapeHTML(alt)+'" loading="lazy" decoding="async">':'';}
 document.getElementById('productDetail').addEventListener('click',async event=>{
  const button=event.target.closest('[data-part-detail]');if(!button||!button.dataset.partDetail)return;
  const current=++request;title.textContent='부품 상세 설명';content.textContent='등록된 부품 설명을 불러오고 있습니다.';dialog.showModal();dialog.scrollTop=0;
  try{
   const{data,error}=await supabaseClient.rpc('get_product_part_detail_v35',{p_product_id:window.pcsDisplayedProduct35,p_field:button.dataset.partDetail});
   if(current!==request)return;if(error)throw error;
   if(!data){content.textContent='이 부품의 상세 설명을 준비하고 있습니다. 궁금한 내용은 상담으로 문의해주세요.';return;}
   title.textContent=[data.manufacturer,data.model_name].filter(Boolean).join(' ')||'부품 상세 설명';
   content.innerHTML=img(data.image_url,title.textContent+' 대표 사진','pcs-part-photo')+(data.specification?'<h3>주요 사양</h3><p>'+escapeHTML(data.specification)+'</p>':'')+'<h3>상세 설명</h3>'+(data.detail_description?'<p>'+escapeHTML(data.detail_description)+'</p>':'')+img(data.description_image_url,title.textContent+' 상세 설명')+(!data.detail_description&&!safeImageUrl(data.description_image_url)?'<p>상세 설명을 준비하고 있습니다.</p>':'');
   content.querySelectorAll('img').forEach(image=>image.addEventListener('error',()=>{const p=document.createElement('p');p.textContent='이미지를 불러오지 못했습니다.';image.replaceWith(p);}));
  }catch(error){if(current===request)content.textContent='상세 설명을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';}
 });
})();
</script>
