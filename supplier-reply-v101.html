  <style>

<script>

/* =====================================
   Supabase 설정
===================================== */

const SUPABASE_URL =
  "https://znsgehjaspiqluopovyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ckUWAvKMJbe5xgGBIQUMIg_f7D1fcGI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   전역 변수
===================================== */

let replyToken = "";
let currentRows = [];


/* =====================================
   HTML 보호
===================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================
   메시지
===================================== */

function showPageMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "pageMessage"
    );

  element.textContent = message;
  element.className =
    "message " + type;
  element.style.display = "block";

}


function hidePageMessage() {

  document
    .getElementById("pageMessage")
    .style
    .display = "none";

}


/* =====================================
   URL 토큰 읽기
===================================== */

function getReplyToken() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("token") || ""
  ).trim();

}


/* =====================================
   페이지 초기화
===================================== */

async function initSupplierReplyPage() {

  replyToken = getReplyToken();

  if (!replyToken) {

    showPageMessage(
      "유효한 회신 링크가 아닙니다.\nPC SOLUTION에서 전달받은 링크를 다시 확인해 주세요.",
      "error"
    );

    return;
  }


  const { data, error } =
    await supabaseClient.rpc(
      "get_supplier_quote_by_token",
      {
        p_reply_token: replyToken
      }
    );


  if (error) {

    console.error(
      "컴오아시스 견적 조회 오류:",
      error
    );

    showPageMessage(
      "견적 정보를 불러오지 못했습니다.\nPC SOLUTION에 문의해 주세요.",
      "error"
    );

    return;
  }


  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    showPageMessage(
      "존재하지 않거나 사용할 수 없는 회신 링크입니다.",
      "error"
    );

    return;
  }


  currentRows = data;

  renderQuote(data);

}

/* =====================================
   컴오아시스 택배비 판별

   기존 공임과 택배비 구분
===================================== */

function isShippingItem(row) {

  return (

    ["공임", "Labor"].includes(
      row.part_type
    )

    &&

    String(
      row.model_name || ""
    ).trim() === "택배비"

  );

}

/* =====================================
   견적 화면 출력
===================================== */

function renderQuote(rows) {

  const first = rows[0];

  document.getElementById(
    "publicCode"
  ).textContent =
    first.public_code || "-";


  const statusElement =
    document.getElementById(
      "replyStatus"
    );

  statusElement.textContent =
    first.reply_status || "회신대기";


  const isCompleted =
    first.reply_status === "회신완료";


  if (isCompleted) {

    statusElement.classList.add(
      "complete"
    );

  } else {

    statusElement.classList.remove(
      "complete"
    );

  }


  const validRows =
    rows.filter(
      row => row.item_id !== null
    );


  const tbody =
    document.getElementById(
      "quoteItems"
    );


  if (validRows.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="6"
          style="
            padding:30px;
            text-align:center;
            color:#94a3b8;
          "
        >
          등록된 견적 품목이 없습니다.
        </td>
      </tr>
    `;

  } else {

    tbody.innerHTML =
      validRows
        .map(function(row) {

          return `
            <tr>

              <th>
                ${escapeHtml(
                  isShippingItem(row)
  ? "🚚 택배비"
  : getPartName(row.part_type)
                )}
              </th>

              <td>
                ${escapeHtml(
                  row.manufacturer || "-"
                )}
              </td>

              <td class="model-cell">
                ${escapeHtml(
                  row.model_name || "-"
                )}
              </td>

              <td class="spec-cell">
                ${escapeHtml(
                  row.specification || "-"
                )}
              </td>

               <td class="qty-cell">

  ${
    isShippingItem(row)

    ? `
      <input
        type="number"
        class="shipping-qty-input"
        data-item-id="${Number(row.item_id)}"
        min="1"
        step="1"
        value="${Math.max(1, Number(row.quantity) || 1)}"
        ${isCompleted ? "disabled" : ""}
      >
    `

    : escapeHtml(row.quantity ?? 1)
  }

</td>              

              <td class="reply-cell">

                <input
                  type="text"
                  class="reply-input"
                  data-item-id="${row.item_id}"
                  value="${escapeHtml(
                    row.supplier_price || ""
                  )}"
                  placeholder="금액 / 품절 / 단종"
                  ${isCompleted
                    ? "disabled"
                    : ""}
                >

              </td>

            </tr>
          `;

        })
        .join("");

  }


  const supplierMessage =
    document.getElementById(
      "supplierMessage"
    );

  supplierMessage.value =
    first.supplier_message || "";

  supplierMessage.disabled =
    isCompleted;


  const submitButton =
    document.getElementById(
      "submitButton"
    );


  if (isCompleted) {

    submitButton.disabled = true;
    submitButton.textContent =
      "✅ 회신 완료";

    showPageMessage(
      "이미 PC SOLUTION에 회신이 완료된 견적입니다.",
      "success"
    );

  } else {

    submitButton.disabled = false;
    submitButton.textContent =
      "📤 PC SOLUTION에 회신하기";

    hidePageMessage();

  }


  document.getElementById(
    "quoteInfo"
  ).style.display = "block";

    document.getElementById(
    "quoteContent"
  ).style.display = "block";


  /* =====================================
     단가 및 택배비 수량 변경 시 자동계산
  ===================================== */

  tbody.oninput = updateQuoteTotal;

  updateQuoteTotal();

}

/* =====================================
   컴오아시스 견적 합계 자동 계산
===================================== */

function updateQuoteTotal() {

  let total = 0;
  let excludedCount = 0;

  const rows =
    document.querySelectorAll(
      "#quoteItems tr"
    );

  rows.forEach(function(row) {

    const priceInput =
      row.querySelector(".reply-input");

    if (!priceInput) {
      return;
    }

    const priceText =
      priceInput.value
        .replaceAll(",", "")
        .replaceAll("원", "")
        .trim();

    // 품절, 단종, 미입력 등은 합계에서 제외
    if (!/^\d+$/.test(priceText)) {
      excludedCount++;
      return;
    }

    const price = Number(priceText);

    const shippingQty =
      row.querySelector(
        ".shipping-qty-input"
      );

    const qtyCell =
      row.querySelector(".qty-cell");

    const quantity = shippingQty
      ? Number(shippingQty.value)
      : Number(qtyCell.textContent.trim());

    if (
      !Number.isSafeInteger(quantity) ||
      quantity < 1 ||
      !Number.isSafeInteger(price)
    ) {
      excludedCount++;
      return;
    }

    total += price * quantity;

  });

  document.getElementById(
    "quoteTotalAmount"
  ).textContent =
    total.toLocaleString("ko-KR") + "원";

  document.getElementById(
    "quoteTotalGuide"
  ).textContent =
    excludedCount > 0
      ? `금액 미입력 또는 계산 제외 품목 ${excludedCount}개가 있습니다. 표시된 합계는 일부 품목 기준입니다.`
      : "모든 품목의 금액이 합계에 반영되었습니다.";

}

/* =====================================
   회신 전송
===================================== */

async function submitReply() {

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const inputs =
    Array.from(
      document.querySelectorAll(
        ".reply-input"
      )
    );


  if (inputs.length === 0) {

    alert(
      "회신할 견적 품목이 없습니다."
    );

    return;
  }

/* =====================================
   회신 품목 데이터 만들기
   택배비 수량만 추가 전송
===================================== */

  let invalidShippingQuantity = false;

  const items =
    inputs.map(function(input) {

      const item = {

        item_id:
          Number(input.dataset.itemId),

        supplier_price:
          input.value.trim()

      };

      // 해당 품목의 행 찾기
      const row = input.closest("tr");

      // 택배비 수량 입력칸 찾기
      const shippingInput =
        row.querySelector(
          ".shipping-qty-input"
        );

      // 택배비 항목에만 수량 추가
      if (shippingInput) {

        const rawQuantity =
          shippingInput.value.trim();

        const quantity =
          Number(rawQuantity);

        if (
          !/^[1-9]\d*$/.test(rawQuantity) ||
          !Number.isSafeInteger(quantity)
        ) {

          invalidShippingQuantity = true;

        } else {

          item.quantity = quantity;

        }

      }

      return item;

    });


  // 택배비 수량 검사
  if (invalidShippingQuantity) {

    alert(
      "택배비 박스 수는 1 이상의 정수로 입력해 주세요."
    );

    return;

  }
  
  const hasAnyReply =
    items.some(
      item =>
        item.supplier_price !== ""
    );


  const supplierMessage =
    document
      .getElementById(
        "supplierMessage"
      )
      .value
      .trim();


  if (
    !hasAnyReply &&
    supplierMessage === ""
  ) {

    alert(
      "최소 한 개 이상의 품목 회신 또는 추가 회신 내용을 입력해 주세요."
    );

    return;
  }


  const confirmed =
    confirm(
      "입력한 내용을 PC SOLUTION에 회신하시겠습니까?\n\n회신 완료 후에는 이 페이지에서 수정할 수 없습니다."
    );


  if (!confirmed) {
    return;
  }


  submitButton.disabled = true;
  submitButton.textContent =
    "회신 전송 중...";


  const { error } =
    await supabaseClient.rpc(
      "submit_supplier_quote_reply_v101",
      {
        p_reply_token:
          replyToken,

        p_supplier_message:
          supplierMessage,

        p_items:
          items
      }
    );


  if (error) {

    console.error(
      "컴오아시스 회신 저장 오류:",
      error
    );

    alert(
      "회신 저장 중 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요."
    );

    submitButton.disabled = false;
    submitButton.textContent =
      "📤 PC SOLUTION에 회신하기";

    return;
  }


  alert(
    "PC SOLUTION에 회신이 정상적으로 전달되었습니다."
  );


  await initSupplierReplyPage();

}

/* =====================================
   컴오아시스 견적 PDF 출력
===================================== */

function printSupplierQuote() {

  const rows = document.querySelectorAll(
    "#quoteItems tr"
  );

  let tableRows = "";
  let total = 0;
  let excludedCount = 0;

  rows.forEach(function(row) {

    const input = row.querySelector(
      ".reply-input"
    );

    if (!input) return;

    const cells = row.querySelectorAll("td");

    const part =
      row.querySelector("th")?.textContent.trim() || "-";

    const maker =
      cells[0]?.textContent.trim() || "-";

    const model =
      cells[1]?.textContent.trim() || "-";

    const spec =
      cells[2]?.textContent.trim() || "-";

    const shippingInput = row.querySelector(
      ".shipping-qty-input"
    );

    const quantityText = shippingInput
      ? shippingInput.value.trim()
      : row.querySelector(".qty-cell")?.textContent.trim() || "";

    const quantity = Number(quantityText);

    const priceText = input.value.trim();

    const numericText = priceText
      .replaceAll(",", "")
      .replaceAll("원", "")
      .trim();

    const price = Number(numericText);

    const valid =
      /^\d+$/.test(numericText) &&
      /^[1-9]\d*$/.test(quantityText) &&
      Number.isSafeInteger(price) &&
      Number.isSafeInteger(quantity) &&
      Number.isSafeInteger(price * quantity);

    const amount = valid
      ? price * quantity
      : null;

    if (valid) {
      total += amount;
    } else {
      excludedCount++;
    }

    tableRows += `
      <tr>
        <td>${escapeHtml(part)}</td>
        <td>${escapeHtml(maker)}</td>
        <td>${escapeHtml(model)}</td>
        <td>${escapeHtml(spec)}</td>
        <td>${escapeHtml(quantityText)}</td>
        <td>${escapeHtml(priceText || "-")}</td>
        <td>
          ${amount === null
            ? "-"
            : amount.toLocaleString("ko-KR") + "원"}
        </td>
      </tr>
    `;

  });

  if (!tableRows) {
    alert("출력할 견적 품목이 없습니다.");
    return;
  }

  if (!Number.isSafeInteger(total)) {
    alert("합계금액이 너무 큽니다. 입력값을 확인해 주세요.");
    return;
  }

  const code = document.getElementById(
    "publicCode"
  ).textContent;

  const status = document.getElementById(
    "replyStatus"
  ).textContent;

  const message = document.getElementById(
    "supplierMessage"
  ).value.trim();

  const today = new Date().toLocaleDateString(
    "ko-KR"
  );

  let printArea = document.getElementById(
    "printQuoteSheet"
  );

  if (!printArea) {
    printArea = document.createElement("section");
    printArea.id = "printQuoteSheet";
    document.body.appendChild(printArea);
  }

  printArea.innerHTML = `
    <h1>컴오아시스 견적 회신서</h1>

    <p><strong>수신 :</strong> PC SOLUTION</p>
    <p><strong>발신 :</strong> 컴오아시스</p>
    <p><strong>상담번호 :</strong> ${escapeHtml(code)}</p>
    <p><strong>회신 상태 :</strong> ${escapeHtml(status)}</p>
    <p><strong>출력일 :</strong> ${escapeHtml(today)}</p>

    <table>
      <thead>
        <tr>
          <th>품목</th>
          <th>제조사</th>
          <th>모델명</th>
          <th>세부사양</th>
          <th>수량</th>
          <th>공급단가 / 상태</th>
          <th>금액</th>
        </tr>
      </thead>

      <tbody>
        ${tableRows}
      </tbody>
    </table>

    <div class="print-total">
      총 합계금액 :
      ${total.toLocaleString("ko-KR")}원
    </div>

    ${
      excludedCount > 0
        ? `<p>※ 금액 미입력 또는 계산 제외 품목
           ${excludedCount}개가 있습니다.
           표시된 합계는 일부 품목 기준입니다.</p>`
        : ""
    }

    <div class="print-note">
      <strong>추가 회신 내용</strong>
      <p>${escapeHtml(message || "없음")}</p>
    </div>
  `;

  window.print();

}
