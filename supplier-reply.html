<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PC SOLUTION - 컴오아시스 견적 회신
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 50px;
      background: #f4f7fb;
      color: #172033;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    .page-wrap {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .header-box {
      padding: 22px;
      margin-bottom: 18px;
      background: #ffffff;
      border: 1px solid #dbe3ee;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    .header-box h1 {
      margin: 0;
      font-size: 25px;
    }

    .header-box p {
      margin: 8px 0 0;
      color: #64748b;
      line-height: 1.6;
    }

    .info-box {
      display: none;
      padding: 16px;
      margin-bottom: 18px;
      background: #ffffff;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      line-height: 1.8;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      margin-left: 6px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 13px;
      font-weight: 700;
    }

    .status-badge.complete {
      background: #ecfdf3;
      color: #15803d;
    }

    .content-box {
      display: none;
      background: #ffffff;
      border: 1px solid #dbe3ee;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 9px;
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #eef2f7;
      vertical-align: middle;
      text-align: left;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    thead th {
      background: #f1f5f9;
      color: #334155;
      font-size: 14px;
      text-align: center;
    }

    tbody th {
      width: 105px;
      background: #f8fafc;
      color: #334155;
      text-align: center;
      white-space: nowrap;
    }

    .model-cell,
    .spec-cell {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.45;
    }

    .qty-cell {
      width: 70px;
      text-align: center;
    }

    .reply-cell {
      width: 190px;
    }

    .reply-input {
      width: 100%;
      min-width: 165px;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font: inherit;
    }

    .reply-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .reply-input:disabled {
      background: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    .bottom-box {
      padding: 20px;
    }

    .bottom-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    #supplierMessage {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      resize: vertical;
      font: inherit;
      line-height: 1.6;
    }

    #supplierMessage:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #supplierMessage:disabled {
      background: #f1f5f9;
      color: #475569;
    }

    .guide {
      margin-top: 8px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .submit-button {
      padding: 12px 22px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #0f5bc8;
    }

    .submit-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 16px;
      margin-bottom: 18px;
      border-radius: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.loading {
      display: block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    @media (max-width: 700px) {

      body {
        padding: 14px 8px 35px;
      }

      .header-box {
        padding: 17px;
      }

      .header-box h1 {
        font-size: 21px;
      }

      .bottom-box {
        padding: 16px;
      }

      .submit-button {
        width: 100%;
      }

    }

  </style>
</head>


<body>

  <main class="page-wrap">

    <div class="header-box">

      <h1>
        📋 PC SOLUTION 견적 회신
      </h1>

      <p>
        컴오아시스 담당자 전용 페이지입니다.<br>
        요청된 품목을 확인한 후 각 품목의 공급금액 또는
        재고 상태를 입력해 주세요.
      </p>

    </div>


    <div
      id="pageMessage"
      class="message loading"
    >
      견적 정보를 불러오는 중입니다.
    </div>


    <div
      id="quoteInfo"
      class="info-box"
    >

      <div>
        <strong>상담번호 :</strong>
        <span id="publicCode">-</span>
      </div>

      <div>
        <strong>회신 상태 :</strong>
        <span
          id="replyStatus"
          class="status-badge"
        >
          회신대기
        </span>
      </div>

    </div>


    <div
      id="quoteContent"
      class="content-box"
    >

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>품목</th>
              <th>제조사</th>
              <th>모델명</th>
              <th>세부사양</th>
              <th>수량</th>
              <th>컴오아시스 회신</th>
            </tr>

          </thead>

          <tbody id="quoteItems"></tbody>

        </table>

      </div>


      <div class="bottom-box">

        <label for="supplierMessage">
          📝 추가 회신 내용
        </label>

        <textarea
          id="supplierMessage"
          placeholder="필요한 경우 추가 전달사항을 입력해 주세요."
        ></textarea>

        <div class="guide">
          각 품목의 회신란에는 공급금액뿐 아니라
          ‘품절’, ‘단종’, ‘대체품 문의’ 등의 내용도 입력할 수 있습니다.
        </div>

        <div class="actions">

          <button
            id="submitButton"
            type="button"
            class="submit-button"
            onclick="submitReply()"
          >
            📤 PC SOLUTION에 회신하기
          </button>

        </div>

      </div>

    </div>

  </main>


<script>

/* =====================================
   Supabase 설정
===================================== */

const SUPABASE_URL =
  "https://znsgehjaspiqluopovyv.supabase.co";

const SUPABASE_KEY =
  "여기에_admin.html과_동일한_sb_publishable_ckUWAvKMJbe5xgGBIQUMIg_f7D1fcGI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   전역 변수
===================================== */

let replyToken = "";
let currentRows = [];


/* =====================================
   HTML 보호
===================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================
   메시지
===================================== */

function showPageMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "pageMessage"
    );

  element.textContent = message;
  element.className =
    "message " + type;
  element.style.display = "block";

}


function hidePageMessage() {

  document
    .getElementById("pageMessage")
    .style
    .display = "none";

}


/* =====================================
   URL 토큰 읽기
===================================== */

function getReplyToken() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("token") || ""
  ).trim();

}


/* =====================================
   페이지 초기화
===================================== */

async function initSupplierReplyPage() {

  replyToken = getReplyToken();

  if (!replyToken) {

    showPageMessage(
      "유효한 회신 링크가 아닙니다.\nPC SOLUTION에서 전달받은 링크를 다시 확인해 주세요.",
      "error"
    );

    return;
  }


  const { data, error } =
    await supabaseClient.rpc(
      "get_supplier_quote_by_token",
      {
        p_reply_token: replyToken
      }
    );


  if (error) {

    console.error(
      "컴오아시스 견적 조회 오류:",
      error
    );

    showPageMessage(
      "견적 정보를 불러오지 못했습니다.\nPC SOLUTION에 문의해 주세요.",
      "error"
    );

    return;
  }


  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    showPageMessage(
      "존재하지 않거나 사용할 수 없는 회신 링크입니다.",
      "error"
    );

    return;
  }


  currentRows = data;

  renderQuote(data);

}


/* =====================================
   견적 화면 출력
===================================== */

function renderQuote(rows) {

  const first = rows[0];

  document.getElementById(
    "publicCode"
  ).textContent =
    first.public_code || "-";


  const statusElement =
    document.getElementById(
      "replyStatus"
    );

  statusElement.textContent =
    first.reply_status || "회신대기";


  const isCompleted =
    first.reply_status === "회신완료";


  if (isCompleted) {

    statusElement.classList.add(
      "complete"
    );

  } else {

    statusElement.classList.remove(
      "complete"
    );

  }


  const validRows =
    rows.filter(
      row => row.item_id !== null
    );


  const tbody =
    document.getElementById(
      "quoteItems"
    );


  if (validRows.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="6"
          style="
            padding:30px;
            text-align:center;
            color:#94a3b8;
          "
        >
          등록된 견적 품목이 없습니다.
        </td>
      </tr>
    `;

  } else {

    tbody.innerHTML =
      validRows
        .map(function(row) {

          return `
            <tr>

              <th>
                ${escapeHtml(
                  getPartName(
                    row.part_type
                  )
                )}
              </th>

              <td>
                ${escapeHtml(
                  row.manufacturer || "-"
                )}
              </td>

              <td class="model-cell">
                ${escapeHtml(
                  row.model_name || "-"
                )}
              </td>

              <td class="spec-cell">
                ${escapeHtml(
                  row.specification || "-"
                )}
              </td>

              <td class="qty-cell">
                ${escapeHtml(
                  row.quantity ?? 1
                )}
              </td>

              <td class="reply-cell">

                <input
                  type="text"
                  class="reply-input"
                  data-item-id="${row.item_id}"
                  value="${escapeHtml(
                    row.supplier_price || ""
                  )}"
                  placeholder="금액 / 품절 / 단종"
                  ${isCompleted
                    ? "disabled"
                    : ""}
                >

              </td>

            </tr>
          `;

        })
        .join("");

  }


  const supplierMessage =
    document.getElementById(
      "supplierMessage"
    );

  supplierMessage.value =
    first.supplier_message || "";

  supplierMessage.disabled =
    isCompleted;


  const submitButton =
    document.getElementById(
      "submitButton"
    );


  if (isCompleted) {

    submitButton.disabled = true;
    submitButton.textContent =
      "✅ 회신 완료";

    showPageMessage(
      "이미 PC SOLUTION에 회신이 완료된 견적입니다.",
      "success"
    );

  } else {

    submitButton.disabled = false;
    submitButton.textContent =
      "📤 PC SOLUTION에 회신하기";

    hidePageMessage();

  }


  document.getElementById(
    "quoteInfo"
  ).style.display = "block";

  document.getElementById(
    "quoteContent"
  ).style.display = "block";

}


/* =====================================
   품목명 표시
===================================== */

function getPartName(partType) {

  const names = {
    Cpu: "CPU",
    MainBoard: "메인보드",
    Ram: "메모리",
    Ssd: "SSD",
    Gpu: "그래픽카드",
    Power: "파워",
    Case: "케이스",
    Cooler: "쿨러",
    Monitor: "모니터",
    Etc: "기타",
    Labor: "공임"
  };

  return (
    names[partType] ||
    partType ||
    "-"
  );

}


/* =====================================
   회신 전송
===================================== */

async function submitReply() {

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  const inputs =
    Array.from(
      document.querySelectorAll(
        ".reply-input"
      )
    );


  if (inputs.length === 0) {

    alert(
      "회신할 견적 품목이 없습니다."
    );

    return;
  }


  const items =
    inputs.map(function(input) {

      return {
        item_id:
          Number(
            input.dataset.itemId
          ),

        supplier_price:
          input.value.trim()
      };

    });


  const hasAnyReply =
    items.some(
      item =>
        item.supplier_price !== ""
    );


  const supplierMessage =
    document
      .getElementById(
        "supplierMessage"
      )
      .value
      .trim();


  if (
    !hasAnyReply &&
    supplierMessage === ""
  ) {

    alert(
      "최소 한 개 이상의 품목 회신 또는 추가 회신 내용을 입력해 주세요."
    );

    return;
  }


  const confirmed =
    confirm(
      "입력한 내용을 PC SOLUTION에 회신하시겠습니까?\n\n회신 완료 후에는 이 페이지에서 수정할 수 없습니다."
    );


  if (!confirmed) {
    return;
  }


  submitButton.disabled = true;
  submitButton.textContent =
    "회신 전송 중...";


  const { error } =
    await supabaseClient.rpc(
      "submit_supplier_quote_reply",
      {
        p_reply_token:
          replyToken,

        p_supplier_message:
          supplierMessage,

        p_items:
          items
      }
    );


  if (error) {

    console.error(
      "컴오아시스 회신 저장 오류:",
      error
    );

    alert(
      "회신 저장 중 오류가 발생했습니다.\n잠시 후 다시 시도해 주세요."
    );

    submitButton.disabled = false;
    submitButton.textContent =
      "📤 PC SOLUTION에 회신하기";

    return;
  }


  alert(
    "PC SOLUTION에 회신이 정상적으로 전달되었습니다."
  );


  await initSupplierReplyPage();

}


/* =====================================
   시작
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  initSupplierReplyPage
);

</script>

</body>
</html>
