<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC SOLUTION 관리자</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #17243a;
}

header {
  background: #17243a;
  color: white;
  padding: 22px;
  text-align: center;
}

main {
  max-width: 500px;
  margin: 50px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d7e2;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #1769e0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1257bb;
}

#message {
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
}

#admin {
  display: none;
}

.logout {
  background: #555;
}
</style>
</head>

<body>

<header>
  <h1>PC SOLUTION</h1>
  <div>관리자 페이지</div>
</header>

<main>

  <!-- 로그인 화면 -->
  <div class="box" id="login">

    <h2>관리자 로그인</h2>

    <label>이메일</label>
    <input
      type="email"
      id="email"
      placeholder="관리자 이메일"
      autocomplete="username"
    >

    <label>비밀번호</label>
    <input
      type="password"
      id="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button onclick="login()">
      로그인
    </button>

    <div id="message"></div>

  </div>


  <!-- 로그인 후 관리자 화면 -->
  <div class="box" id="admin">

    <h2>관리자 메뉴</h2>

    <p>관리자 로그인 성공! 🎉</p>

    <button onclick="logout()" class="logout">
      로그아웃
    </button>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://znsgehjaspiqluopovyv.supabase.co";

const SUPABASE_KEY =
  "api sb_publishable_ckUWAvKMJbe5xgGBIQUMIg_f7D1fcGI";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.textContent =
      "이메일과 비밀번호를 입력해주세요.";

    message.style.color = "red";

    return;
  }


  message.textContent =
    "로그인 중...";

  message.style.color = "#17243a";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


  if (error) {

    message.textContent =
      "로그인 실패: " + error.message;

    message.style.color = "red";

    return;
  }


  message.textContent =
    "로그인 성공!";

  message.style.color = "green";


  document.getElementById("login").style.display =
    "none";

  document.getElementById("admin").style.display =
    "block";
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("admin").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";

  document.getElementById("email").value =
    "";

  document.getElementById("password").value =
    "";

  document.getElementById("message").textContent =
    "";
}


async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    document.getElementById("login").style.display =
      "none";

    document.getElementById("admin").style.display =
      "block";
  }
}
 checkSession();

</script>

</body>
</html>
