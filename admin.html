<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC SOLUTION 관리자</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #17243a;
}

header {
  background: #17243a;
  color: white;
  padding: 22px;
  text-align: center;
}

main {
  max-width: 700px;
  margin: 35px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 28px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d7e2;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 9px;
  background: #1769e0;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1257bb;
}

button:disabled {
  background: #9aa7b8;
  cursor: not-allowed;
}

#login {
  display: none;
}

#admin {
  display: none;
}

#message {
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

#preview {
  display: none;
  width: 220px;
  max-height: 220px;
  object-fit: contain;
  margin: 15px auto;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.logout {
  background: #555;
}

.logout:hover {
  background: #333;
}

hr {
  border: 0;
  border-top: 1px solid #e5e9ef;
  margin: 25px 0;
}
</style>
</head>

<body>

<header>
  <h1>PC SOLUTION</h1>
  <div>관리자 페이지</div>
</header>

<main>

  <!-- 로그인 -->
  <div class="box" id="login">

    <h2>관리자 로그인</h2>

    <label>이메일</label>
    <input
      type="email"
      id="email"
      placeholder="관리자 이메일"
      autocomplete="username"
    >

    <label>비밀번호</label>
    <input
      type="password"
      id="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      로그인
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- 관리자 -->
  <div class="box" id="admin">

    <h2>상품 등록</h2>

    <label>상품 사진</label>
    <input
      type="file"
      id="image"
      accept="image/*"
    >

    <img id="preview" alt="상품 미리보기">


    <label>상품명</label>
    <input
      type="text"
      id="name"
      placeholder="예: 게이밍 PC"
    >


    <label>가격</label>
    <input
      type="text"
      id="price"
      placeholder="예: 1299000"
    >


    <label>CPU</label>
    <input
      type="text"
      id="cpu"
      placeholder="예: Ryzen 5 7600"
    >


    <label>그래픽카드</label>
    <input
      type="text"
      id="gpu"
      placeholder="예: RTX 5060"
    >


    <label>RAM</label>
    <input
      type="text"
      id="ram"
      placeholder="예: DDR5 32GB"
    >


    <label>SSD</label>
    <input
      type="text"
      id="ssd"
      placeholder="예: NVMe 1TB"
    >


    <label>메인보드</label>
    <input
      type="text"
      id="main_board"
      placeholder="예: B650M"
    >


    <label>파워</label>
    <input
      type="text"
      id="power"
      placeholder="예: 750W"
    >


    <label>모니터</label>
    <input
      type="text"
      id="monitor"
      placeholder="예: 27인치 QHD"
    >


    <label>HDD</label>
    <input
      type="text"
      id="hdd"
      placeholder="선택사항"
    >


    <label>키보드 / 마우스</label>
    <input
      type="text"
      id="keyboard_mouse"
      placeholder="예: 게이밍 키보드 + 마우스"
    >


    <label>상품 설명</label>
    <textarea
      id="description"
      placeholder="상품에 대한 설명을 입력하세요."
    ></textarea>


   <button id="saveButton" onclick="saveProduct()">
  상품 등록
</button>

<button
  id="cancelEditButton"
  class="logout"
  onclick="cancelEdit()"
  style="display:none;"
>
  수정 취소
</button>
  
    <div id="message"></div>

    <hr>

<h2>등록된 상품</h2>

<div id="productList">
  상품을 불러오는 중...
</div>
    <hr>
    <button class="logout" onclick="logout()">
      로그아웃
    </button>

  </div>

</main>


<script>

/* =========================
   Supabase 연결
========================= */

const SUPABASE_URL =
  "https://znsgehjaspiqluopovyv.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_ckUWAvKMJbe5xgGBIQUMIg_f7D1fcGI";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
/* =========================
   수정 중인 상품 ID
========================= */

let editingProductId = null;
let editingImageUrl = null;

/* =========================
   상품 수정 화면에 불러오기
========================= */

function editProduct(product) {

  editingProductId = product.id;

  editingImageUrl = product.image_url || null;

  document.getElementById("name").value =
    product.name || "";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("cpu").value =
    product.cpu || "";

  document.getElementById("gpu").value =
    product.gpu || "";

  document.getElementById("ram").value =
    product.ram || "";

  document.getElementById("ssd").value =
    product.ssd || "";

  document.getElementById("main_board").value =
    product["main board"] || "";

  document.getElementById("power").value =
    product.power || "";

  document.getElementById("monitor").value =
    product.monitor || "";

  document.getElementById("hdd").value =
    product.hdd || "";

  document.getElementById("keyboard_mouse").value =
    product["keyboard mouse"] || "";

  document.getElementById("description").value =
    product.description || "";

  const preview =
    document.getElementById("preview");

  if (editingImageUrl) {

    preview.src = editingImageUrl;

    preview.style.display = "block";

  } else {

    preview.removeAttribute("src");

    preview.style.display = "none";

  }

  document.getElementById("image").value = "";

  document.getElementById("saveButton").textContent =
    "상품 수정 저장";

  document.getElementById("cancelEditButton").style.display =
    "block";

  document.getElementById("message").textContent =
    "상품 수정 중입니다.";

  document.getElementById("message").style.color =
    "#1769e0";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}
 
  /* =========================
   로그인
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  const button =
    document.getElementById("loginButton");


  if (!email || !password) {

    message.textContent =
      "이메일과 비밀번호를 입력해주세요.";

    message.style.color = "red";

    return;
  }


  button.disabled = true;

  button.textContent =
    "로그인 중...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


  if (error) {

    message.textContent =
      "로그인 실패: " + error.message;

    message.style.color = "red";

    button.disabled = false;

    button.textContent =
      "로그인";

    return;
  }


  message.textContent =
    "로그인 성공!";

  message.style.color = "green";


  showAdmin();

}


/* =========================
   관리자 화면
========================= */

function showAdmin() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("admin").style.display =
    "block";
}


/* =========================
   로그아웃
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("admin").style.display =
    "none";

  document.getElementById("login").style.display =
    "block";

  document.getElementById("email").value =
    "";

  document.getElementById("password").value =
    "";

  document.getElementById("loginMessage").textContent =
    "";

}


/* =========================
   세션 확인
========================= */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    showAdmin();

  } else {

    document.getElementById("login").style.display =
      "block";

  }
}


/* =========================
   이미지 미리보기
========================= */

document
  .getElementById("image")
  .addEventListener("change", function(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    const preview =
      document.getElementById("preview");


    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";
  });


/* =========================
   상품 등록
========================= */

async function saveProduct() {

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("saveButton");


  message.textContent =
    "";

  button.disabled =
    true;

  button.textContent =
    "등록 중...";


  try {

    /* 로그인 확인 */

    const {
      data: sessionData
    } =
      await supabaseClient.auth.getSession();


    if (!sessionData.session) {

      throw new Error(
        "로그인이 필요합니다."
      );

    }


    /* 입력값 */

    const imageFile =
      document.getElementById("image").files[0];

    const name =
      document.getElementById("name").value.trim();

    const price =
      document.getElementById("price").value.trim();

    const cpu =
      document.getElementById("cpu").value.trim();

    const gpu =
      document.getElementById("gpu").value.trim();

    const ram =
      document.getElementById("ram").value.trim();

    const ssd =
      document.getElementById("ssd").value.trim();

    const mainBoard =
      document.getElementById("main_board").value.trim();

    const power =
      document.getElementById("power").value.trim();

    const monitor =
      document.getElementById("monitor").value.trim();

    const hdd =
      document.getElementById("hdd").value.trim();

    const keyboardMouse =
      document
        .getElementById("keyboard_mouse")
        .value
        .trim();

    const description =
      document
        .getElementById("description")
        .value
        .trim();


    /* 상품명 확인 */

    if (!name) {

      throw new Error(
        "상품명을 입력해주세요."
      );

    }


    /* =========================
       이미지 업로드
    ========================= */

    let imageUrl = null;


    if (imageFile) {

      const fileExtension =
        imageFile.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        fileExtension;


      const filePath =
        fileName;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            imageFile,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        throw new Error(
          "사진 업로드 실패: " +
          uploadError.message
        );

      }


      /* 공개 URL */

      const {
        data: publicUrlData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(filePath);


      imageUrl =
        publicUrlData.publicUrl;

    }


    /* =========================
       products 저장
    ========================= */

    const productData = {

      name: name,

      price: price,

      cpu: cpu,

      gpu: gpu,

      ram: ram,

      ssd: ssd,

      "main board":
        mainBoard,

      power: power,

      monitor: monitor,

      hdd: hdd,

      "keyboard mouse":
        keyboardMouse,

      description:
        description,

      image_url:
        imageUrl

    };


    const {
      error: insertError
    } =
      await supabaseClient
        .from("pcsolution")
        .insert([productData]);


    if (insertError) {

      throw new Error(
        "상품 저장 실패: " +
        insertError.message
      );

    }


    /* =========================
       성공
    ========================= */

    message.textContent =
      "🎉 상품 등록 완료!";

    message.style.color =
      "green";


    /* 입력값 초기화 */

    document.getElementById("image").value =
      "";

    document.getElementById("preview").style.display =
      "none";

    document.getElementById("name").value =
      "";

    document.getElementById("price").value =
      "";

    document.getElementById("cpu").value =
      "";

    document.getElementById("gpu").value =
      "";

    document.getElementById("ram").value =
      "";

    document.getElementById("ssd").value =
      "";

    document.getElementById("main_board").value =
      "";

    document.getElementById("power").value =
      "";

    document.getElementById("monitor").value =
      "";

    document.getElementById("hdd").value =
      "";

    document.getElementById("keyboard_mouse").value =
      "";

    document.getElementById("description").value =
      "";


  } catch (error) {

    console.error(error);

    message.textContent =
      "❌ " + error.message;

    message.style.color =
      "red";

  }


  button.disabled =
    false;

  button.textContent =
    "상품 등록";
}


/* =========================
   시작
========================= */
async function loadProducts() {

  const productList =
    document.getElementById("productList");

  productList.innerHTML =
    "상품을 불러오는 중...";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("pcsolution")
      .select("*")
      .order("id", { ascending: false });


  if (error) {

    productList.innerHTML =
      "❌ 상품 불러오기 실패: " +
      error.message;

    return;
  }


  if (!data || data.length === 0) {

    productList.innerHTML =
      "등록된 상품이 없습니다.";

    return;
  }


  productList.innerHTML = "";


  data.forEach(product => {

    const card =
      document.createElement("div");

    card.style.border =
      "1px solid #ddd";

    card.style.borderRadius =
      "12px";

    card.style.padding =
      "15px";

    card.style.marginBottom =
      "15px";

    card.style.background =
      "#fafafa";


    let imageHTML = "";


    if (product.image_url) {

      imageHTML =
        `<img
          src="${product.image_url}"
          style="
            width:160px;
            height:120px;
            object-fit:cover;
            border-radius:8px;
            margin-bottom:10px;
          "
        >`;

    }


    card.innerHTML = `

      ${imageHTML}

      <h3>
        ${product.name || "상품명 없음"}
      </h3>

      <p>
        💰 가격:
        ${product.price || "-"}
      </p>

      <p>
        🧠 CPU:
        ${product.cpu || "-"}
      </p>

      <p>
        🎮 그래픽카드:
        ${product.gpu || "-"}
      </p>

      <p>
        💾 RAM:
        ${product.ram || "-"}
      </p>

      <p>
        💽 SSD:
        ${product.ssd || "-"}
      </p>

    `;


    productList.appendChild(card);

  });

}
checkSession().then(() => {
  loadProducts();
});

</script>

</body>
</html>
