<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PC SOLUTION 관리자</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px 50px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
      margin-bottom: 22px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
      background: #fff;
      color: #172033;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 17px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .login-button,
    .save-button {
      background: #1769e0;
      color: #fff;
    }

    .login-button {
      width: 100%;
      margin-top: 20px;
    }

    .update-button {
      background: #f59e0b;
      color: #fff;
    }

    .cancel-button {
      background: #64748b;
      color: #fff;
      margin-left: 8px;
    }

    .delete-button {
      background: #dc2626;
      color: #fff;
    }

    .logout-button {
      background: #17243a;
      color: #fff;
    }

    .mail-button {
      background: #7c3aed;
      color: #fff;
    }

    .phone-button {
      background: #16a34a;
      color: #fff;
    }

    .memo-button {
      background: #0f766e;
      color: #fff;
    }

    .refresh-button {
      background: #0f766e;
      color: #fff;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =====================================
       관리자 상단
    ===================================== */

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .admin-title {
      margin: 0;
    }

    .admin-subtitle {
      margin: 7px 0 0;
      color: #667085;
      font-size: 14px;
    }

    /* =====================================
       상품
    ===================================== */

    .product-item {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      background: #fff;
    }

    .product-item img {
      width: 180px;
      height: 130px;

      border-radius: 10px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;

    .product-price {

       상담 관리
    ===================================== */

      gap: 15px;
      flex-wrap: wrap;
    }

    .quote-count {
      color: #667085;
      font-size: 14px;
    }

    .filter-box {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-top: 18px;
    }

    .quote-item {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      background: #fff;
      transition: .2s;
    }

    .quote-item:hover {
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .quote-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .customer-name {

    .phone-link {

    .info-label {
      color: #667085;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .detail-box {
      margin-top: 18px;
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
    }

    .detail-box summary {
      cursor: pointer;
      color: #1769e0;
      font-weight: bold;
      padding: 7px 0;
    }

    .detail-content {
      margin-top: 15px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .status-area {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .memo-area {
      margin-top: 18px;

    .action-row {

      gap: 8px;

      margin-top: 15px;

    /* =====================================
       상담 통계
    ===================================== */

    .quote-stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
    }

    .quote-stat {
      min-width: 0;
      padding: 18px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      text-align: center;
    }

    .quote-stat-label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 10px;
      white-space: nowrap;
    }

    .quote-stat-number {
      font-size: 27px;
      font-weight: bold;
      color: #172033;
    }

    /* 전체 상담 */
    .quote-stat.total {
      background: #f8fafc;
      border-color: #e5e7eb;
    }

    .quote-stat.total .quote-stat-number {
      color: #172033;
    }

    /* 신규 접수 */
    .quote-stat.new {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .quote-stat.new .quote-stat-number {
      color: #2563eb;
    }

    /* 상담 진행 중 */
    .quote-stat.progress {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .quote-stat.progress .quote-stat-number {
      color: #d97706;
    }

    /* 견적 완료 */
    .quote-stat.complete {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .quote-stat.complete .quote-stat-number {
      color: #16a34a;
    }

    /* 구매 완료 */
    .quote-stat.purchased {
      background: #ecfeff;
      border-color: #a5f3fc;
    }

    .quote-stat.purchased .quote-stat-number {
      color: #0891b2;
    }

    /* =====================================
       모바일
    ===================================== */

    @media(max-width: 800px) {

      .quote-stats {
        grid-template-columns: repeat(3, 1fr);
      }

    @media(max-width: 600px) {

      .product-item img {
        width: 100%;
        height: 200px;
      }

      .cancel-button {
        margin-left: 0;
        margin-top: 8px;
      }

    }
  </style>
</head>

<script>

/* =====================================
   Supabase 설정
===================================== */

const SUPABASE_URL =
  "https://znsgehjaspiqluopovyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ckUWAvKMJbe5xgGBIQUMIg_f7D1fcGI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   전역 변수
===================================== */

let allProducts = [];
let editingProduct = null;
let allQuoteRequests = [];

let quoteRequestLoadError = false;


/* =====================================
   메시지 표시
===================================== */

function showMessage(
  elementId,
  message,
  type = "success"
) {

  const element =
    document.getElementById(elementId);

  if (!element) return;

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


function hideMessage(elementId) {

  const element =
    document.getElementById(elementId);

  if (!element) return;

  element.style.display =
    "none";

}


/* =====================================
   HTML 보호
===================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   줄바꿈 처리
===================================== */

function formatText(value) {

  return escapeHTML(value || "-")
    .replace(/\n/g, "<br>");

}


/* =====================================
   로그인
===================================== */

async function login() {

  hideMessage("loginMessage");

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const loginButton =
    document.getElementById("loginButton");

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "이메일과 비밀번호를 입력해주세요.",
      "error"
    );

    return;

  }

  loginButton.disabled = true;
  loginButton.textContent = "로그인 중...";

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      throw error;
    }

    document
      .getElementById("loginSection")
      .classList
      .add("hidden");

    document
      .getElementById("adminSection")
      .classList
      .remove("hidden");

    document
      .getElementById("password")
      .value = "";

    await loadProducts();
    await loadQuoteRequests();

  } catch (error) {

    console.error(
      "로그인 오류:",
      error
    );

    showMessage(
      "loginMessage",
      "로그인 실패: " +
      (error.message || "알 수 없는 오류"),
      "error"
    );

  } finally {

    loginButton.disabled = false;

    loginButton.textContent =
      "🔐 로그인";

  }

}


/* =====================================
   로그아웃
===================================== */

async function logout() {

  try {

    const {
      error
    } =
      await supabaseClient
        .auth
        .signOut();

    if (error) {
      throw error;
    }

    location.reload();

  } catch (error) {

    console.error(
      "로그아웃 오류:",
      error
    );

    alert(
      "로그아웃 실패: " +
      error.message
    );

  }

}


/* =====================================
   세션 확인
===================================== */

async function checkSession() {

  try {

    const {
      data,
      error
    } =

/* =====================================
   이미지 업로드
===================================== */

async function uploadImage(file) {

  if (!file) {
    return null;
  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );

  if (error) {

    throw new Error(
      "사진 업로드 실패: " +
      error.message
    );

  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(fileName);

  return data.publicUrl;

}

async function deleteProduct(id) {

  const product =
    allProducts.find(

  if (!product) {

    alert(
      "상품을 찾을 수 없습니다."

  }

  if (!confirm(
    `"${product.name}" 상품을 삭제하시겠습니까?`

    return;

  }

  try {

    const {
      error
    } =
      await supabaseClient
        .from("pcsolution")
        .delete()
        .eq(
          "id",
          product.id
        );

    if (error) {
      throw error;

    if (
      editingProduct &&
      Number(editingProduct.id) ===
      Number(product.id)

    showMessage(

function updateQuoteStats() {

  const total =
    allQuoteRequests.length;


  const newCount =
    allQuoteRequests.filter(
      request =>
        (request.status || "접수") ===
        "접수"
    ).length;


  const progressCount =
    allQuoteRequests.filter(
      request =>
        [
          "상담중",
          "견적작성"
        ].includes(
          request.status || "접수"
        )
    ).length;


  const completeCount =
    allQuoteRequests.filter(
      request =>
        (request.status || "접수") ===
        "견적완료"
    ).length;


  const purchasedCount =
    allQuoteRequests.filter(
      request =>
        (request.status || "접수") ===
        "구매완료"
    ).length;


  /* 전체 상담 */

  const statTotal =
    document.getElementById(
      "statTotal"
    );

  if (statTotal) {
    statTotal.textContent =
      total;
  }


  /* 신규 접수 */

  const statNew =
    document.getElementById(
      "statNew"
    );

  if (statNew) {
    statNew.textContent =
      newCount;
  }


  /* 상담 진행 중 */

  const statProgress =
    document.getElementById(
      "statProgress"
    );

  if (statProgress) {
    statProgress.textContent =
      progressCount;
  }


  /* 견적 완료 */

  const statComplete =
    document.getElementById(
      "statComplete"
    );

  if (statComplete) {
    statComplete.textContent =
      completeCount;
  }


  /* 구매 완료 */

  const statPurchased =
    document.getElementById(
      "statPurchased"
    );

  if (statPurchased) {
    statPurchased.textContent =
      purchasedCount;
  }

}


/* =====================================
   상담 검색 / 필터
===================================== */

function filterQuoteRequests() {

  const search =
    document
      .getElementById("quoteSearch")
      .value
      .trim()
      .toLowerCase();

  const statusFilter =
    document
      .getElementById(
        "quoteStatusFilter"
      )
      .value;


  const filtered =
    allQuoteRequests.filter(
      request => {

        const searchable = [

          request.customer_name,
          request.phone,
          request.purpose,
          request.preferred_cpu,
          request.preferred_gpu,
          request.preferred_ram,
          request.preferred_ssd,
          request.additional_request,
          request.notes,
          request.budget

        ]
        .filter(
          value =>
            value !== null &&
            value !== undefined
        )
        .join(" ")
        .toLowerCase();


        const searchMatch =
          !search ||
          searchable.includes(
            search
          );


        const status =
          request.status ||
          "접수";


        const statusMatch =
          !statusFilter ||
          status === statusFilter;


        return (
          searchMatch &&
          statusMatch
        );

      }
    );


  document
    .getElementById("quoteCount")
    .textContent =
      `전체 ${allQuoteRequests.length}건 · 현재 ${filtered.length}건`;


  updateQuoteStats();

  renderQuoteRequests(
    filtered
  );

}

/* =====================================
   상담 상태 변경
===================================== */

async function updateQuoteStatus(
  id,
  status
) {

  const request =
    allQuoteRequests.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!request) {

    alert(
      "상담 신청을 찾을 수 없습니다."
    );

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("quote_requests")
        .update({

          status:
            status,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    request.status =
      status;


    updateQuoteStats();


    const card =
      document.getElementById(
        `quote-${id}`
      );


    if (card) {

      const badge =
        card.querySelector(
          ".status-badge"
        );


      if (badge) {

        badge.textContent =
          status;

        badge.className =
          "status-badge status-" +
          status;

      }

    }


    /*
      현재 필터와 다른 상태로 변경된 경우
      목록을 다시 그려서 자연스럽게 제거
    */

    filterQuoteRequests();

  } catch (error) {

    console.error(
      "상태 변경 오류:",
      error
    );

    alert(
      "상태 변경 실패!\n\n" +
      error.message
    );

  }

}


/* =====================================
   관리자 메모 저장
===================================== */

async function saveQuoteMemo(id) {

  const textarea =
    document.getElementById(
      `memo-${id}`
    );


  if (!textarea) {
    return;
  }


  const notes =
    textarea.value;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("quote_requests")
        .update({

          notes:
            notes,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    const request =
      allQuoteRequests.find(
        item =>
          Number(item.id) ===
          Number(id)
      );


    if (request) {

      request.notes =
        notes;

    }


    alert(
      "✅ 메모가 저장되었습니다."
    );

  } catch (error) {

    console.error(
      "메모 저장 오류:",
      error
    );

    alert(
      "메모 저장 실패!\n\n" +
      error.message
    );

  }

}


/* =====================================
   상담 삭제
===================================== */

async function deleteQuoteRequest(
  id
) {

  const request =
    allQuoteRequests.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!request) {

    alert(
      "상담 신청을 찾을 수 없습니다."
    );

    return;

  }


  const name =
    request.customer_name ||
    "고객";


  const confirmed =
    confirm(
      `"${name}"님의 상담 신청을 삭제하시겠습니까?\n\n삭제 후 복구할 수 없습니다.`
    );


  if (!confirmed) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("quote_requests")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {
      throw error;
    }


    allQuoteRequests =
      allQuoteRequests.filter(
        item =>
          Number(item.id) !==
          Number(id)
      );


    filterQuoteRequests();

  } catch (error) {

    console.error(
      "상담 삭제 오류:",
      error
    );

    alert(
      "상담 삭제 실패!\n\n" +
      error.message
    );

  }

}


/* =====================================
   개별 상담 이메일 알림
===================================== */

function sendQuoteMail(id) {

  const request =
    allQuoteRequests.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!request) {

    alert(
      "상담 신청을 찾을 수 없습니다."
    );

    return;

  }


  const customer =
    request.customer_name ||
    "-";


  const phone =
    request.phone ||
    "-";


  const purpose =
    request.purpose ||
    "-";


  const status =
    request.status ||
    "접수";


  const subject =
    encodeURIComponent(
      `[PC SOLUTION] 상담 신청 - ${customer}`
    );


  const body =
    encodeURIComponent(
`
PC SOLUTION 상담 신청

고객명 : ${customer}
연락처 : ${phone}
사용목적 : ${purpose}
상태 : ${status}

관리자 페이지에서 상세 내용을 확인해주세요.
`
    );


  const adminEmail =
    "ssamddak7@naver.com";


  window.location.href =
    `mailto:${adminEmail}?subject=${subject}&body=${body}`;

}


/* =====================================
   신규 상담 관리자 알림
===================================== */

function notifyNewQuote() {

  const newQuotes =
    allQuoteRequests.filter(
      request =>
        (request.status || "접수") ===
        "접수"
    );


  if (!newQuotes.length) {

    alert(
      "현재 '접수' 상태인 새로운 상담 신청이 없습니다."
    );

    return;

  }


  sendQuoteMail(
    Number(newQuotes[0].id)
  );

}
